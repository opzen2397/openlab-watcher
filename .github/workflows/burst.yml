name: OPEN LAB 棄權盯場

# 由 cron-job.org 在 9:14、13:14、17:14 呼叫 GitHub API 觸發
on:
  workflow_dispatch:
    inputs:
      watch_all:
        description: '測試用：立刻開始，盯今天所有被預約的時段 2 分鐘'
        type: boolean
        default: false

concurrency:
  group: openlab-burst
  cancel-in-progress: false

jobs:
  burst:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 讀取上次結果
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: 盯場
        run: python3 watcher.py burst
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          WATCH_ALL: ${{ inputs.watch_all }}

      - name: 儲存這次結果
        if: always() && hashFiles('state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
